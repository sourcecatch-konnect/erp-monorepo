name: Production CI

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  server:
    name: Server build
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379
      ACCESS_TOKEN_SECRET: ci-access-token-secret
      REFRESH_TOKEN_SECRET: ci-refresh-token-secret
      JWT_SECRET: ci-jwt-secret
      PUPPETEER_SKIP_DOWNLOAD: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @skerp/server db:generate

      - name: Build server workspace
        run: pnpm --filter @skerp/server... build

      - name: Validate Compose file
        run: docker compose -f docker-compose.server.yml config

      - name: Build server Docker image
        run: docker build -f apps/server/Dockerfile -t skerp-server:ci .

