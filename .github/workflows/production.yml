name: Deploy production

# Builds the three production images in CI (with BuildKit layer cache), then
# streams them to the instance over SSH — no container registry involved.
# See deploy/README.md for the one-time instance + secrets setup.

on:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DEPLOY_PATH: ${{ vars.PROD_DEPLOY_PATH || '/opt/skerp' }}
  SSH_PORT: ${{ secrets.PROD_SSH_PORT || 22 }}
  SSH_DEST: ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}
  SSH_OPTS: -i ~/.ssh/deploy_key -o ServerAliveInterval=30

jobs:
  build-and-deploy:
    name: Build images and deploy over SSH
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: |
          echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Validate compose file
        run: docker compose -f deploy/docker-compose.prod.yml config -q
        env:
          POSTGRES_PASSWORD: ci-validate
          REDIS_PASSWORD: ci-validate

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          target: runner
          load: true
          tags: skerp-server:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Build migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          target: migrator
          load: true
          tags: skerp-migrate:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: runner
          load: true
          tags: skerp-web:${{ steps.meta.outputs.tag }}
          build-args: |
            NEXT_PUBLIC_API_URL=/api
            NEXT_PUBLIC_SOCKET_URL=/
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
            NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID=${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Stream images to instance
        run: |
          docker save \
            "skerp-server:$TAG" \
            "skerp-migrate:$TAG" \
            "skerp-web:$TAG" \
            | gzip \
            | ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_DEST" "gunzip | docker load"

      - name: Copy deploy files
        run: |
          ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_DEST" "mkdir -p '$DEPLOY_PATH'"
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" \
            deploy/docker-compose.prod.yml deploy/Caddyfile \
            "$SSH_DEST:$DEPLOY_PATH/"

      - name: Roll out
        run: |
          ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_DEST" "
            set -e
            cd '$DEPLOY_PATH'
            test -f .env || { echo 'ERROR: $DEPLOY_PATH/.env missing — see deploy/README.md' >&2; exit 1; }
            sed -i '/^IMAGE_TAG=/d' .env
            printf 'IMAGE_TAG=%s\n' '$TAG' >> .env
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
          "

      - name: Verify stack
        run: |
          ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_DEST" "
            cd '$DEPLOY_PATH'
            docker compose -f docker-compose.prod.yml ps
          "

      - name: Prune old images (keep last 7 days for rollback)
        run: |
          ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_DEST" \
            "docker image prune -af --filter 'until=168h'"
